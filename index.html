<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobrevive a la Navidad · ADT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: cercano, con guiño; humor de sobremesa navideña, sin perder el oficio
   IDEA: un muestrario de tapicero convertido en juego: cada desastre, su tejido
   PICTURE: escena ilustrada del salón que cambia al elegir bien el tejido
   COLOUR and TYPE: papel y tinta de ADT, verde botella y burdeos navideños; Cormorant + Poppins
   LAYOUT: una columna móvil: escena arriba, historia, tres opciones, veredicto */
:root{color-scheme:light dark;
--bg:light-dark(#FCFAF7,#151312);--ink:light-dark(#181614,#F3EEE8);--muted:light-dark(#6F6862,#B3AAA1);
--card:light-dark(#FFFFFF,#201D1B);--line:light-dark(#E7DFD7,#38322E);--blush:light-dark(#F6E7DE,#2C2420);
--green:#2E4B45;--wine:#6E2431;--ok:light-dark(#1F6B52,#7FD1AE);--bad:light-dark(#9C2F2F,#F19A8E)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Poppins',system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.top{background:#252322;color:#fff;margin:0 -16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:block;height:48px;width:auto}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#4a4440}
.dots i.on{background:#fff}.dots i.ok{background:#7FD1AE}.dots i.ko{background:#E59A8E}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,11vw,52px)}h2{font-size:clamp(28px,7vw,34px)}
.fig{position:relative;aspect-ratio:400/260;margin:18px -16px 0;background:#EFE6DC;overflow:hidden;box-shadow:inset 0 -18px 30px -24px #0006,inset 0 10px 24px -18px #0005}
.fig svg,.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fig canvas{touch-action:none;cursor:crosshair}
.tag{display:inline-block;background:var(--blush);color:var(--ink);font-size:13px;font-weight:500;padding:4px 10px;border-radius:2px;margin:18px 0 8px}
.story{font-size:17px;margin:8px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:14px 16px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink);font:500 15.5px/1.4 'Poppins',sans-serif;cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--ink)}.opt:active{transform:scale(.985)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:13px}
.opt:disabled{opacity:.45;cursor:default;border-color:var(--line)}.opt.ko{border-color:var(--bad);opacity:.55;cursor:default}.opt.ok{border-color:var(--ok);border-width:2px}
.verdict{margin-top:18px;padding:18px;border-radius:3px;background:var(--card);border:1px solid var(--line)}
.verdict.ok{border-left:4px solid var(--ok)}.verdict.ko{border-left:4px solid var(--bad)}
.verdict h3{margin:0 0 6px;font:600 17px/1.3 'Poppins',sans-serif}
.verdict p{margin:0 0 8px}.verdict .tip{font-size:14.5px;color:var(--muted);margin:10px 0 0}
.btn{display:block;width:100%;margin-top:16px;padding:16px 20px;border:0;border-radius:3px;background:#181614;color:#fff;font:600 14.5px/1.2 'Poppins',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer}
.btn.green{background:#1E8A4C}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
:root[data-theme=dark] .btn:not(.green):not(.ghost){background:#F3EEE8;color:#181614}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn:not(.green):not(.ghost){background:#F3EEE8;color:#181614}}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:10px 0 0}
.meter{height:8px;background:var(--blush);border-radius:8px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.diploma{margin-top:20px;padding:26px 20px;text-align:center;border:1px solid var(--line);outline:6px double var(--line);outline-offset:-12px;background:var(--card)}
.diploma .big{font:600 clamp(46px,14vw,64px)/1 'Cormorant Garamond',serif;color:var(--ok)}
.diploma .rank{font:italic 600 24px/1.2 'Cormorant Garamond',serif;margin:6px 0 0}
.greet{font:500 21px/1.45 'Cormorant Garamond',serif;margin:24px 0 6px}
.pro{background:var(--blush);padding:14px 16px;border-radius:3px;font-size:14.5px;margin-top:20px}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
footer a{color:inherit}
.fine{font-size:13px;color:var(--muted);margin-top:14px}
.fade{animation:fd .4s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade,.shake{animation:none}.opt{transition:none}}
</style>
</head>

{

const pie = `<footer>Almacén del Tapicero · 38 años de oficio · Polígono Industrial de Monda, Málaga<br>WhatsApp 657 691 254 · info@almacendeltapicero.com · <a href="https://almacendeltapicero.com" target="_blank" rel="noopener">almacendeltapicero.com</a></footer>`;
const svg = inner => `<svg viewBox="0 0 400 260" role="img" aria-hidden="true">${DEFS}${inner}</svg>`;

function inicio(){
  nivel=-1; aciertos=0; resultados=[];
  app.innerHTML = cabecera() + `<div class="fade">
  <div class="fig">${svg(room()+tree()+sofa()+stainSVG()+glass(true)+cat(false))}</div>
  <span class="tag">Felicitación navideña · edición 2026</span>
  <h1>Sobrevive a la Navidad</h1>
  <p class="story">Seis desastres navideños muy reales. Un sofá, unas sillas, una terraza… y tú. Elige el tejido adecuado y llega a Reyes con la casa intacta.</p>
  <button class="btn" id="go">Empezar el juego</button>
  <p class="hint">Unos 3 minutos · Sin registro · Funciona en el móvil</p></div>` + pie;
  document.getElementById('go').onclick = () => { nivel=0; jugar(); };
}

function jugar(){
  fallado = false;
  const N = NIVELES[nivel];
  app.innerHTML = cabecera() + `<div class="fade">
  <div class="fig" id="fig">${svg(N.escena('antes'))}</div>
  <span class="tag">Desastre ${nivel+1} de ${NIVELES.length} · ${esc(N.fecha)}</span>
  <h2>${esc(N.titulo)}</h2>
  <p class="story">${esc(N.historia)}</p>
  <div class="opts" id="opts">${N.opciones.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABC'[i]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
  <div id="out"></div></div>` + pie;
  window.scrollTo({top:0});
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => elegir(+b.dataset.i, b));
}

function elegir(i, btn){
  const N = NIVELES[nivel], o = N.opciones[i];
  if (btn.classList.contains('ko') || document.querySelector('.opt.ok')) return;
  const out = document.getElementById('out');
  if (!o.ok){
    fallado = true;
    btn.classList.add('ko','shake');
    out.innerHTML = `<div class="verdict ko fade"><h3>Uy… desastre confirmado</h3><p>${esc(o.r)}</p><p class="tip">Prueba otra opción.</p></div>`;
    return;
  }
  btn.classList.add('ok');
  document.querySelectorAll('.opt:not(.ok)').forEach(b => b.disabled = true);
  resultados[nivel] = !fallado; if (!fallado) aciertos++;
  if (N.frotar) return frotar(out);
  resolver(out);
}

function resolver(out){
  const N = NIVELES[nivel];
  document.getElementById('fig').innerHTML = svg(N.escena('despues'));
  const ultimo = nivel === NIVELES.length-1;
  out.innerHTML = `<div class="verdict ok fade"><h3>${fallado?'¡Salvado! (a la segunda)':'¡Salvado a la primera!'}</h3><p>${esc(N.bien)}</p><p class="tip">${esc(N.tip)}</p></div>
  <button class="btn" id="next">${ultimo?'Ver mi diploma':'Siguiente desastre'}</button>`;
  document.querySelector('.dots').outerHTML = cabecera().match(/<div class="dots"[\s\S]*?<\/div>/)[0];
  document.getElementById('next').onclick = () => { if (ultimo) final(); else { nivel++; jugar(); } };
  out.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
}

/* ---------- Minijuego: frotar la mancha ---------- */
function frotar(out){
  const fig = document.getElementById('fig'), N = NIVELES[nivel];
  fig.innerHTML = svg(N.escena('frotar')) + '<canvas id="cv" aria-label="Mancha de vino: frótala con el dedo o el ratón"></canvas>';
  out.innerHTML = `<div class="verdict ok fade"><h3>Buena elección. Ahora, ¡a frotar!</h3><p>Pasa el dedo (o el ratón) por la mancha: es solo agua.</p><div class="meter"><i id="mt"></i></div></div><button class="btn ghost" id="auto">Hazlo tú por mí</button>`;
  fig.scrollIntoView({behavior:'smooth', block:'center'});
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width = fig.clientWidth * 2, H = cv.height = fig.clientHeight * 2, k = W/400;
  ctx.fillStyle = 'rgba(110,36,49,.9)';
  stainBlobs.forEach(([x,y,rx,ry]) => { ctx.beginPath(); ctx.ellipse(x*k, y*k, rx*k, ry*k, 0, 0, Math.PI*2); ctx.fill(); });
  const box = [100*k, 145*k, 140*k, 45*k];
  const cuenta = () => { const d = ctx.getImageData(...box).data; let n=0; for (let j=3;j<d.length;j+=16) if (d[j]>20) n++; return n; };
  const total = cuenta(); let hecho = false, pasos = 0;
  ctx.globalCompositeOperation = 'destination-out';
  const borrar = (x,y) => {
    ctx.beginPath(); ctx.arc(x, y, 16*k, 0, Math.PI*2); ctx.fill();
    if (++pasos % 4) return;
    const pct = 1 - cuenta()/total;
    document.getElementById('mt').style.width = Math.min(100, pct/0.85*100) + '%';
    if (pct > .85 && !hecho) terminar();
  };
  const terminar = () => { hecho = true; ctx.clearRect(0,0,W,H); setTimeout(() => resolver(out), 250); };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H]; };
  let down = false;
  cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); borrar(...pos(e)); });
  cv.addEventListener('pointermove', e => { if (down && !hecho) borrar(...pos(e)); });
  cv.addEventListener('pointerup', () => down = false);
  document.getElementById('auto').onclick = () => { if (!hecho) terminar(); };
}

/* ---------- Final ---------- */
function final(){
  nivel = NIVELES.length;
  const [ , rango, frase] = RANGOS.find(r => aciertos >= r[0]);
  const msgWA = `¡Hola, ADT! He jugado a «Sobrevive a la Navidad» y he salvado ${aciertos} de 6 a la primera. Os cuento mi desastre navideño de verdad: `;
  const msgShare = `He salvado ${aciertos} de 6 muebles en «Sobrevive a la Navidad» de Almacén del Tapicero. ¿Lo superas?${URL_JUEGO?' '+URL_JUEGO:''}`;
